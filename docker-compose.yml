version: '3.1'
services:
  database:
    container_name: chasing_clout_db
    image: postgres
    restart: always
    env_file:
      - .env
    environment:
      PGPORT: ${DATABASE_PORT}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:${DATABASE_PORT}"
    volumes:
      # scripts only run on an empty volume: `docker compose down -v` to reset the DB
      - ./initdb:/docker-entrypoint-initdb.d
