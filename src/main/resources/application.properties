spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# the schema comes from initdb/*.sql, Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
# send the ResponseStatusException messages (e.g. "Solde insuffisant") to the front
server.error.include-message=always
# signs the login tokens (HS256): at least 32 characters, from .env, never committed
jwt.secret=${JWT_SECRET}
